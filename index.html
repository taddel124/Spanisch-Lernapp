<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Spanisch Lernapp</title>
<meta name="theme-color" content="#5B4BF5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Spanisch" />
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="styles.css" />
<style>
  html, body { margin: 0; padding: 0; background: #F5F7FC; overscroll-behavior: none; }
  #root { min-height: 100vh; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
          background: linear-gradient(180deg,#F7F9FF 0%,#F2F5FC 40%,#F5F7FC 100%); font-family: system-ui, sans-serif; z-index: 1; }
  #boot .box { text-align: center; }
  #boot .spin { width: 36px; height: 36px; border: 4px solid #E7EBF5; border-top-color: #5B4BF5;
                border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #boot p { color: #727A96; font-size: 13px; }
</style>
</head>
<body>
<div id="boot"><div class="box"><div class="spin"></div><p>Spanisch Lernapp wird geladen…</p></div></div>
<div id="root"></div>
<script src="storage-shim.js"></script>
<script>
  window.addEventListener("DOMContentLoaded", function () {
    var b = document.getElementById("boot");
    setTimeout(function () { if (b) b.style.display = "none"; }, 600);
  });
</script>
<script src="bundle.js"></script>
</body>
</html>
